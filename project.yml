name: Pocket Mac
options:
  bundleIdPrefix: com.zakisheriff.pocketmac
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

packages:
  BigInt:
    url: https://github.com/attaswift/BigInt
    from: 5.3.0

settings:
  base:
    SWIFT_VERSION: 5.0
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Pocket Mac:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/PocketMac
    resources:
      - path: Sources/PocketMac/Resources/Assets.xcassets
    dependencies:
      - sdk: libz.tbd
    info:
      path: Sources/PocketMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocket Mac
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Pocket Mac looks for Macs with Screen Sharing turned on so you can control them from your iPhone.
        NSBonjourServices:
          - _rfb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakisheriff.pocketmac
        PRODUCT_NAME: Pocket Mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          # Decoding a live Mac screen is far too slow unoptimised; run
          # Debug builds at full speed while keeping them testable.
          SWIFT_OPTIMIZATION_LEVEL: -O
          ENABLE_TESTABILITY: YES
  Pocket Mac Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/PocketMacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakisheriff.pocketmac.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pocket Mac
      - package: BigInt

schemes:
  Pocket Mac:
    build:
      targets:
        Pocket Mac: all
        Pocket Mac Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Pocket Mac Tests
    archive:
      config: Release
