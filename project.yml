name: Pocket Mac
options:
  bundleIdPrefix: com.zakisheriff.pocketmac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: 5.0
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Pocket Mac:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PocketMac
    resources:
      - path: Sources/PocketMac/Resources/Assets.xcassets
    info:
      path: Sources/PocketMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocket Mac
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakisheriff.pocketmac
        PRODUCT_NAME: Pocket Mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    capabilities: {}
  Pocket Mac Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PocketMacTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakisheriff.pocketmac.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pocket Mac

schemes:
  Pocket Mac:
    build:
      targets:
        Pocket Mac: all
        Pocket Mac Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Pocket Mac Tests
    archive:
      config: Release
